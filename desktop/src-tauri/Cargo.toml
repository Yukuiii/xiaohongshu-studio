[package]
name = "xiaohongshu-studio-desktop"
version = "0.1.0"
description = "红薯创作台桌面客户端"
authors = ["xpzouying", "Yukuiii"]
edition = "2021"

[lib]
name = "xiaohongshu_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
url = "2"
