<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>红薯创作台</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f4f5f7;
        --white: #ffffff;
        --ink: #111827;
        --muted: #6b7280;
        --line: #e5e7eb;
        --red: #ff2442;
        --red-soft: #fff1f3;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--paper);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: min(420px, calc(100vw - 32px));
        background: var(--white);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 32px 28px;
        text-align: center;
        box-shadow:
          0 1px 2px rgba(15, 23, 42, 0.04),
          0 12px 32px rgba(15, 23, 42, 0.07);
      }
      .badge {
        display: block;
        width: 56px;
        height: 56px;
        object-fit: contain;
        margin: 0 auto 16px;
        border-radius: 14px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 19px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 13.5px;
        line-height: 1.6;
      }
      .spinner {
        width: 22px;
        height: 22px;
        margin: 20px auto 0;
        border: 2px solid var(--line);
        border-top-color: var(--red);
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
      }
      .error {
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 10px;
        background: var(--red-soft);
        border: 1px solid #fecdd3;
        color: #be123c;
        font-size: 13px;
        text-align: left;
        word-break: break-word;
        display: none;
      }
      .actions {
        margin-top: 16px;
        display: none;
        gap: 10px;
        justify-content: center;
      }
      button {
        border: 1px solid #d1d5db;
        background: var(--white);
        color: var(--ink);
        border-radius: 8px;
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      button.primary {
        background: var(--red);
        border-color: var(--red);
        color: #fff;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="badge" src="./logo.png" alt="" width="64" height="64" />
      <h1>红薯创作台</h1>
      <p id="status">正在启动本地创作服务与内置浏览器环境…</p>
      <div id="spinner" class="spinner" aria-hidden="true"></div>
      <div id="error" class="error" role="alert"></div>
      <div id="actions" class="actions">
        <button id="quit" class="primary" type="button">退出应用</button>
      </div>
    </main>
    <script>
      window.__xhsDesktopSetError = function (message) {
        document.getElementById("status").textContent = "本地服务启动失败";
        document.getElementById("spinner").style.display = "none";
        const box = document.getElementById("error");
        box.textContent = message || "未知错误，请检查数据目录或端口占用。";
        box.style.display = "block";
        const actions = document.getElementById("actions");
        actions.style.display = "flex";
      };
      document.getElementById("quit").addEventListener("click", function () {
        if (window.__TAURI_INTERNALS__) {
          window.__TAURI_INTERNALS__.invoke("quit_app").catch(function () {});
        }
      });
    </script>
  </body>
</html>
