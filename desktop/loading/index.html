<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="红薯创作台正在启动本地创作服务与浏览器环境。"
    />
    <title>红薯创作台</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #fcfcfc;
        --paper: #efeff0;
        --ink: #111112;
        --muted: #686a6e;
        --accent: #0064d4;
        --accent-hover: #0057b8;
        --on-accent: #ffffff;
        --line: #e5e5e7;
        --error-ink: #b42336;
        --error-bg: #fff1f3;
        --error-line: #f5c9d0;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --canvas: #181819;
          --paper: #303032;
          --ink: #ffffff;
          --muted: #a3a6ac;
          --accent: #1793ff;
          --accent-hover: #6bbcff;
          --on-accent: #071b2d;
          --line: #ffffff1f;
          --error-ink: #ff98a2;
          --error-bg: #3c252b;
          --error-line: #654049;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        color: var(--ink);
        background: var(--canvas);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .page {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 64px 24px 120px;
      }
      .brand {
        width: 100%;
        max-width: 560px;
        text-align: center;
      }
      .logo {
        display: block;
        width: 80px;
        height: 80px;
        margin: 0 auto 28px;
        border-radius: 24px;
      }
      h1 {
        margin: 0;
        font-size: clamp(36px, 4vw, 48px);
        font-weight: 500;
        line-height: 1.3;
        letter-spacing: -0.035em;
      }
      .en {
        margin-top: 10px;
        font-size: 11px;
        letter-spacing: 0.16em;
        color: var(--muted);
      }
      .tagline {
        margin: 24px 0 0;
        font-size: 17px;
        line-height: 1.7;
        color: var(--muted);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 28px;
        padding: 10px 18px;
        border: 1px solid transparent;
        border-radius: 999px;
        background: var(--paper);
        color: var(--muted);
        font-size: 12px;
      }
      .badge i {
        width: 6px;
        height: 6px;
        flex: none;
        border-radius: 50%;
        background: var(--accent);
      }
      /* 启动状态与错误提示 */
      .footer {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 0 24px;
        pointer-events: none;
      }
      .spinner {
        width: 16px;
        height: 16px;
        flex: none;
        border: 2px solid var(--line);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .status {
        margin: 0;
        font-size: 12.5px;
        line-height: 1.6;
        color: var(--muted);
        text-align: center;
      }
      .error {
        display: none;
        max-height: 150px;
        overflow: auto;
        margin: 28px auto 0;
        padding: 16px 20px;
        border: 1px solid var(--error-line);
        border-radius: 20px;
        background: var(--error-bg);
        color: var(--error-ink);
        font-size: 13px;
        line-height: 1.7;
        text-align: left;
        overflow-wrap: anywhere;
      }
      .actions {
        display: none;
        justify-content: center;
        margin-top: 18px;
      }
      button {
        appearance: none;
        min-height: 42px;
        border: 1px solid var(--accent);
        border-radius: 999px;
        padding: 10px 22px;
        background: var(--accent);
        color: var(--on-accent);
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      @media (max-height: 600px) {
        .page {
          padding: 32px 20px 88px;
        }
        .logo {
          width: 60px;
          height: 60px;
          margin-bottom: 18px;
        }
        .footer {
          position: static;
          padding: 0 20px 24px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>

    <main class="page">
      <section class="brand">
        <img
          class="logo"
          src="./logo.png"
          width="120"
          height="120"
          alt="红薯创作台"
        />
        <h1>红薯创作台</h1>
        <div class="en">XIAOHONGSHU STUDIO</div>
        <p class="tagline">从一个灵感，到一篇好笔记。</p>
        <div class="badge"><i aria-hidden="true"></i><span>自部署 · 多账号 · AI 创作</span></div>
        <div id="error" class="error" role="alert"></div>
        <div id="actions" class="actions">
          <button id="quit" type="button">退出应用</button>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div id="spinner" class="spinner" aria-hidden="true"></div>
      <p id="status" class="status" role="status" aria-live="polite">
        正在启动本地创作服务与内置浏览器环境…
      </p>
    </footer>

    <script>
      // Tauri 启动失败时由 Rust 侧调用，保留原有兜底与退出能力。
      window.__xhsDesktopSetError = function (message) {
        document.getElementById("status").textContent = "本地服务启动失败";
        document.getElementById("spinner").style.display = "none";
        const box = document.getElementById("error");
        box.textContent = message || "未知错误，请检查数据目录或端口占用。";
        box.style.display = "block";
        document.getElementById("actions").style.display = "flex";
      };
      document.getElementById("quit").addEventListener("click", function () {
        if (window.__TAURI_INTERNALS__) {
          window.__TAURI_INTERNALS__.invoke("quit_app").catch(function () {});
        }
      });
    </script>
  </body>
</html>
