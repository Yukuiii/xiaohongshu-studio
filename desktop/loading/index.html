<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>红薯创作台</title>
    <style>
      :root {
        --paper: #f7f6f2;
        --white: #ffffff;
        --ink: #292b29;
        --muted: #83847e;
        --line: #eae9e3;
        --red: #d94b3e;
        --red-soft: #fcf0ed;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--paper);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      .card {
        width: min(440px, calc(100vw - 32px));
        background: var(--white);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 32px 28px;
        text-align: center;
        box-shadow: 0 12px 32px rgba(41, 43, 41, 0.06);
      }
      .badge {
        display: inline-grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: var(--red-soft);
        color: var(--red);
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }
      .spinner {
        width: 24px;
        height: 24px;
        margin: 20px auto 0;
        border: 2.5px solid var(--line);
        border-top-color: var(--red);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .error {
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 12px;
        background: var(--red-soft);
        color: #9e2d22;
        font-size: 13px;
        text-align: left;
        word-break: break-word;
        display: none;
      }
      .actions {
        margin-top: 16px;
        display: none;
        gap: 10px;
        justify-content: center;
      }
      button {
        border: 1px solid var(--line);
        background: var(--white);
        color: var(--ink);
        border-radius: 10px;
        padding: 8px 16px;
        font-size: 13px;
        cursor: pointer;
      }
      button.primary {
        background: var(--red);
        border-color: var(--red);
        color: #fff;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge" aria-hidden="true">薯</div>
      <h1>红薯创作台</h1>
      <p id="status">正在启动本地创作服务与内置浏览器环境…</p>
      <div id="spinner" class="spinner" aria-hidden="true"></div>
      <div id="error" class="error" role="alert"></div>
      <div id="actions" class="actions">
        <button id="quit" class="primary" type="button">退出应用</button>
      </div>
    </main>
    <script>
      window.__xhsDesktopSetError = function (message) {
        document.getElementById("status").textContent = "本地服务启动失败";
        document.getElementById("spinner").style.display = "none";
        const box = document.getElementById("error");
        box.textContent = message || "未知错误，请检查数据目录或端口占用。";
        box.style.display = "block";
        const actions = document.getElementById("actions");
        actions.style.display = "flex";
      };
      document.getElementById("quit").addEventListener("click", function () {
        if (window.__TAURI_INTERNALS__) {
          window.__TAURI_INTERNALS__.invoke("quit_app").catch(function () {});
        }
      });
    </script>
  </body>
</html>
