name: Verify pinned browser assets

# 默认关闭；启用后只校验固定版本，不发现新版本、不写仓库。
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Report verification status
        env:
          ENABLED: ${{ vars.ENABLE_BROWSER_UPDATES == 'true' }}
        run: |
          if [ "$ENABLED" = true ]; then
            echo 'Pinned browser asset verification enabled; automatic upgrades remain disabled.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Disabled by default. Set ENABLE_BROWSER_UPDATES=true to verify pinned official assets. Automatic upgrades remain disabled.' >> "$GITHUB_STEP_SUMMARY"
          fi

  verify:
    runs-on: ubuntu-latest
    if: vars.ENABLE_BROWSER_UPDATES == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify official assets against repository SHA256 manifest
        env:
          BROWSER_DOWNLOAD_BASE: https://github.com/adryfish/fingerprint-chromium/releases/download
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < browser/browser_version.txt)
          ARCHIVES=(
            "ungoogled-chromium-${VERSION}-1-x86_64_linux.tar.xz"
            "ungoogled-chromium_${VERSION}-1.1_macos.dmg"
            "ungoogled-chromium_${VERSION}-1.1_windows_x64.zip"
          )
          DOWNLOAD_DIR=$(mktemp -d)
          trap 'rm -rf "$DOWNLOAD_DIR"' EXIT
          for ARCHIVE in "${ARCHIVES[@]}"; do
            EXPECTED=$(awk -v asset="$ARCHIVE" '$2 == asset {print $1}' browser/browser_checksums.txt)
            test "${#EXPECTED}" -eq 64
            curl -fsSL "${BROWSER_DOWNLOAD_BASE}/${VERSION}/${ARCHIVE}" -o "${DOWNLOAD_DIR}/${ARCHIVE}"
            printf '%s  %s\n' "$EXPECTED" "${DOWNLOAD_DIR}/${ARCHIVE}" | sha256sum --check -
          done
          echo "Verified all three official assets for pinned fingerprint-chromium ${VERSION}. No version files were changed." >> "$GITHUB_STEP_SUMMARY"
