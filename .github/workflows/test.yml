name: Test

# 只跑 hermetic 单元测试（无浏览器/无网络）。
# 有头浏览器集成测试用 //go:build integration 隔离：默认不运行，仅编译校验。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Unit tests
        run: go test ./...

      # 编译覆盖五个平台；发布仅包含具备内置浏览器的三个目标平台。
      # 平台相关错误在发版前暴露；这里只编译，不运行浏览器。
      - name: Cross-compile check
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            echo "==> $target"
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build ./...
          done

      # 集成测试只编译不运行：保证它们始终跟当前 API 一致、不烂掉，
      # 但绝不在 CI 启动有头浏览器（-run '^$' 匹配空，一个用例都不跑）。
      - name: Compile integration tests (no run)
        run: go test -tags integration -run '^$' ./...
