name: Desktop Release

on:
  push:
    tags:
      # 只匹配语义化版本 tag，不匹配历史遗留的日期 tag
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（默认使用 tag 或 short SHA）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Dependencies
        run: |
          npm --prefix web ci
          npm --prefix desktop ci

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          elif [ "$REF_TYPE" = "tag" ]; then
            version="$REF_NAME"
          else
            version="${SHORT_SHA:0:7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Desktop Bundle
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm --prefix desktop run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Xiaohongshu Studio ${{ github.ref_name }}
          files: |
            dist/**/*.dmg
            dist/**/*-setup.exe
            dist/**/*.msi
          generate_release_notes: true
          body: |
            ## 红薯创作台 ${{ github.ref_name }}

            ### 📦 下载
            - **macOS Apple Silicon**：`.dmg`
            - **Windows x64**：`-setup.exe` 或 `.msi`
            - **Linux / 服务器**：使用 [Docker 部署](https://github.com/${{ github.repository }}/blob/main/docker/README.md)

            ### 💾 数据目录
            - macOS：`~/Library/Application Support/com.xiaohongshu.studio/`
            - Windows：`%LOCALAPPDATA%\com.xiaohongshu.studio\`

            首次启动会解压内置浏览器，请预留约 400MB 磁盘空间；账号、模型配置、草稿和发布防重记录保存在 `studio.db`。

            > macOS 安装包目前未签名；如被 Gatekeeper 拦截，请右键选择「打开」，或执行：
            > `xattr -dr com.apple.quarantine "/Applications/Xiaohongshu Studio.app"`
