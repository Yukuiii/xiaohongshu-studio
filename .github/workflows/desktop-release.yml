name: Desktop Release

on:
  push:
    tags:
      # 只匹配语义化版本 tag，不匹配历史遗留的日期 tag
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（默认使用 tag 或 short SHA）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Dependencies
        run: |
          npm --prefix web ci
          npm --prefix desktop ci

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            version="$REF_NAME"
          elif [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="${SHORT_SHA:0:7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Desktop Bundle
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm --prefix desktop run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist

      - name: Create Desktop Update Manifest
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', tag):
              raise SystemExit('无效的桌面稳定版 tag')

          dist = Path('dist')
          assets = {}
          for suffix in ('_aarch64.dmg', '_x64-setup.exe', '_x64_en-US.msi'):
              name = f'Xiaohongshu.Studio_{tag[1:]}{suffix}'
              # 打包器输出含空格的名称，Release 沿用带点的文件名。
              paths = list(dist.rglob(name)) + list(dist.rglob(name.replace('.', ' ', 1)))
              if len(paths) != 1 or not paths[0].is_file() or paths[0].stat().st_size == 0:
                  raise SystemExit(f'桌面安装包缺失或不唯一: {name}')
              path = paths[0]
              if path.name != name:
                  path = path.rename(path.with_name(name))
              with path.open('rb') as package:
                  digest = hashlib.file_digest(package, 'sha256').hexdigest()
              assets[name] = {'size': path.stat().st_size, 'sha256': digest}

          manifest = {'version': tag, 'assets': assets}
          (dist / 'studio-update.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Xiaohongshu Studio ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/**/*.dmg
            dist/**/*-setup.exe
            dist/**/*.msi
            dist/studio-update.json
          generate_release_notes: true
          body: |
            ## 红薯创作台 ${{ github.ref_name }}

            ### 📦 下载
            - **macOS Apple Silicon**：`.dmg`
            - **Windows x64**：`-setup.exe` 或 `.msi`
            - **Linux / 服务器**：使用 [Docker 部署](https://github.com/${{ github.repository }}/blob/main/docker/README.md)

            ### 💾 数据目录
            - macOS：`~/Library/Application Support/com.xiaohongshu.studio/`
            - Windows：`%LOCALAPPDATA%\com.xiaohongshu.studio\`

            首次启动会解压内置浏览器，请预留约 400MB 磁盘空间；账号、模型配置、草稿和发布防重记录保存在 `studio.db`。

            > macOS 安装包目前未签名；如被 Gatekeeper 拦截，请右键选择「打开」，或执行：
            > `xattr -dr com.apple.quarantine "/Applications/Xiaohongshu Studio.app"`
