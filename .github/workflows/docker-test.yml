name: Studio Docker Image

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - .github/workflows/docker-*.yml
      - '**/*.go'
      - go.mod
      - go.sum
      - web/**
      - browser/browser_version.txt
      - browser/browser_checksums.txt
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - .github/workflows/docker-*.yml
      - '**/*.go'
      - go.mod
      - go.sum
      - web/**
      - browser/browser_version.txt
      - browser/browser_checksums.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4
        id: buildx
        with:
          use: false

      # 仅构建默认完整应用镜像，测试过程不登录或推送仓库。
      - name: Build studio image with embedded desktop
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          load: true
          tags: xhs-studio:ci
          build-args: VERSION=ci
          # PR 缓存与正式发布缓存隔离，避免混用不受信任的构建结果。
          cache-from: type=gha,scope=ci-studio
          cache-to: type=gha,scope=ci-studio,mode=max
          provenance: false
          sbom: false

      - name: Check embedded desktop, access boundaries and recovery
        run: python3 docker/desktop/smoke_test.py xhs-studio:ci

      # 扫描工具只运行在 CI，不进入任何成品镜像；下载文件按固定 SHA256 校验。
      - name: Scan studio image vulnerabilities
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: "false"
          GRYPE_DB_CACHE_DIR: ${{ runner.temp }}/grype-db
        run: |
          mkdir -p "$RUNNER_TEMP/image-audit"
          archive="$RUNNER_TEMP/grype.tar.gz"
          curl -fsSL --retry 3 https://github.com/anchore/grype/releases/download/v0.121.0/grype_0.121.0_linux_amd64.tar.gz -o "$archive"
          printf '%s  %s\n' '64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519' "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" grype
          "$RUNNER_TEMP/grype" db update
          export GRYPE_DB_AUTO_UPDATE=false
          "$RUNNER_TEMP/grype" docker:xhs-studio:ci --quiet -o json > "$RUNNER_TEMP/image-audit/studio.json"
          python3 docker/desktop/check_vulnerabilities.py "$RUNNER_TEMP/image-audit/studio.json"

      - name: Save image vulnerability reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-security-reports
          path: ${{ runner.temp }}/image-audit/*.json
          if-no-files-found: ignore
