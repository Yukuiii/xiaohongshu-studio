services:
  xiaohongshu-studio:
    # 默认使用已发布镜像；./up.sh 会覆盖为提交号并强制本地构建。
    image: ghcr.io/yukuiii/xiaohongshu-studio:${XHS_IMAGE_TAG:-latest}
    platform: linux/amd64
    pull_policy: missing
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: dev
        BASE_IMAGE_PREFIX: docker.io/library
        APT_MIRROR: https://archive.ubuntu.com/ubuntu
        APT_SECURITY_MIRROR: https://security.ubuntu.com/ubuntu
        BROWSER_DOWNLOAD_BASE: https://github.com/adryfish/fingerprint-chromium/releases/download
    hostname: xiaohongshu-studio
    container_name: xiaohongshu-studio
    restart: unless-stopped
    stop_grace_period: 60s
    tty: true
    shm_size: 1gb
    cap_drop:
      - ALL
    # 兼容其他 UID 拥有的已有 data 目录。
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/app/data
      - ./images:/app/images:ro
    environment:
      - AUTH_TOKEN=${AUTH_TOKEN:-}
      - XHS_PROXY=${XHS_PROXY:-}
    ports:
      - "127.0.0.1:${XHS_WEB_PORT:-18060}:18060"
